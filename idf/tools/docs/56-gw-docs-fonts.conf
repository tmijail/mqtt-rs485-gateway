<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- The fonts of the screenshots of the web UI (idf/tools/docs_shots.py, the image gw-docs).
     The page asks for system-ui and sans-serif, which have no fixed font in a container: Inter
     (the package fonts-inter) is the font of all the images in docs/images. The text goes into
     images, not onto a screen: no hinting and no colour fringes, so that each host draws the
     same pixels. This file sorts after 49-sansserif.conf and before the files that prefer
     DejaVu Sans; the stock 10-* and 11-* files only fill values that are not set, and this file
     assigns them. -->
<fontconfig>
  <alias><family>system-ui</family><prefer><family>Inter</family></prefer></alias>
  <alias><family>sans-serif</family><prefer><family>Inter</family></prefer></alias>
  <match target="pattern">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>false</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintnone</const></edit>
    <edit name="autohint" mode="assign"><bool>false</bool></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcdnone</const></edit>
  </match>
</fontconfig>
