# QA-4: build the firmware, run the host tests and the QEMU end-to-end scenario on every push
# and pull request. See docs/reference/tests.md for what each step proves.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The ESP-IDF v6.1 image is pinned by digest so a re-tagged image cannot change the build silently.
# Issue #229: for the same reason, each action is pinned to a full commit hash, with its tag in
# the comment. actions/checkout does not keep the token in .git/config (persist-credentials:
# false, zizmor's artipacked audit): no step uses git with credentials.
#
# Issue #233: the caches. The jobs that build use ccache (IDF_CCACHE_ENABLE=1, CCACHE_DIR in
# actions/cache, one key per job and variant: each run restores the newest one and saves its own).
# CCACHE_COMPILERCHECK=content: each configure writes a new -specs file into the build directory,
# and with the default check (mtime) ccache then never finds an entry of an earlier build.
#
# Issue #253: the e2e and e2e-poison jobs run in the E2E image on ghcr.io (idf/tools/e2e/Dockerfile,
# published by e2e-image.yml), pinned by digest. It holds QEMU, mosquitto and the venv of the
# harness, so these jobs install nothing. When the Dockerfile or idf/tools/e2e/requirements.txt
# changes, e2e-image.yml publishes a new image: copy its digest (job summary) to both jobs.
jobs:
  host-tests:
    name: Host tests (QA-1) and Sparkplug interop
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # -O2: the warnings that need the optimizer (-Wformat-truncation, -Wstringop-overread,
      # -Wnull-dereference) stop the build here, and the tests run on optimized code. A local
      # build without CMAKE_C_FLAGS stays at -O0, for a debugger.
      - name: Build and run the host tests (-O2)
        run: |
          cmake -S idf/test/host -B build-host -DCMAKE_C_FLAGS=-O2
          cmake --build build-host -j"$(nproc)"
          ctest --test-dir build-host --output-on-failure
      - name: Decode generated payloads with the official Tahu proto
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install -q -r idf/tools/e2e/requirements.txt
          mkdir -p /tmp/spb
          build-host/spb_dump /tmp/spb
          /tmp/venv/bin/python idf/tools/spb_decode.py --check /tmp/spb
      - name: spb_decode.py --check self-test (each rule rejects a bad payload)
        run: /tmp/venv/bin/python idf/tools/test_spb_decode.py
      - name: E2E harness self-test (fault signatures and retry rule, issues #92 and #96)
        run: /tmp/venv/bin/python idf/tools/e2e/test_harness.py
      # Issue #229: the linters, with pinned versions and only rules that find errors. ruff is in
      # tools/e2e/requirements.txt, shellcheck, actionlint and zizmor in tools/lint/requirements.txt,
      # ESLint in tools/lint/package-lock.json.
      - name: ruff on the Python tools (issues #107 and #229)
        run: /tmp/venv/bin/ruff check --no-cache idf/tools
      - name: shellcheck on the shell scripts, actionlint and zizmor on the workflows (issue #229)
        run: |
          /tmp/venv/bin/pip install -q -r idf/tools/lint/requirements.txt
          git ls-files -z '*.sh' | xargs -0 /tmp/venv/bin/shellcheck
          /tmp/venv/bin/actionlint -shellcheck /tmp/venv/bin/shellcheck
          /tmp/venv/bin/zizmor --offline .github/workflows
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
      - name: ESLint on the scripts of the web UI (issue #229)
        run: |
          npm ci --prefix idf/tools/lint --no-audit --no-fund
          idf/tools/lint/node_modules/.bin/eslint --config idf/tools/lint/eslint.config.mjs idf/components/gw_web/www/
      - name: Unit test of the IPv4 normalization of the web UI (issue #226)
        run: node --test idf/test/web/test_ip4norm.mjs

  # Issue #225: the same host tests and Sparkplug payloads with AddressSanitizer and
  # UndefinedBehaviorSanitizer (GW_SANITIZE=ON: -fsanitize=address,undefined
  # -fno-sanitize-recover=all, on every target). The first finding stops the test with a failure.
  host-tests-sanitizers:
    name: Host tests with ASan and UBSan (issue #225)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The ASan runtime of GCC 13 can crash at start with more than 28 bits of mmap
      # randomization (newer kernels permit 32). Set 28, as in the local runs of #225.
      - name: Limit the mmap randomization for ASan
        run: sudo sysctl -w vm.mmap_rnd_bits=28
      - name: Build and run the host tests with the sanitizers
        run: |
          cmake -S idf/test/host -B build-asan -DGW_SANITIZE=ON
          cmake --build build-asan -j"$(nproc)"
          ctest --test-dir build-asan --output-on-failure
      - name: Decode the payloads of the sanitized spb_dump with the official Tahu proto
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install -q -r idf/tools/e2e/requirements.txt
          mkdir -p /tmp/spb
          build-asan/spb_dump /tmp/spb
          /tmp/venv/bin/python idf/tools/spb_decode.py --check /tmp/spb

  # Issue #226: the libFuzzer targets of the parsers of gw_core (idf/test/fuzz), with ASan and
  # UBSan. Each target fuzzes 60 s, as many at a time as the runner has CPUs (4: three rounds of
  # 60 s for the 12 targets). The corpus that the weekly job (fuzz-weekly.yml) keeps in the cache
  # is the start, together with the seeds; this job does not save it. A crash stops the job; its
  # input and the logs are in the artifact fuzz-findings.
  fuzz:
    name: Fuzz the parsers of gw_core (issue #226)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install clang 18 and its sanitizer runtimes
        timeout-minutes: 45   # apt_install.sh: 2 mirrors, 20 min at most each
        run: |
          sudo idf/tools/ci/apt_install.sh clang-18 libclang-rt-18-dev
      # The ASan runtime can crash at start with more than 28 bits of mmap randomization
      - name: Limit the mmap randomization for ASan
        run: sudo sysctl -w vm.mmap_rnd_bits=28
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build-fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-
      - name: Build the fuzz targets
        run: |
          cmake -S idf/test/fuzz -B build-fuzz -DCMAKE_C_COMPILER=clang-18
          cmake --build build-fuzz -j"$(nproc)"
      - name: Run each target for 60 s
        run: |
          set -o pipefail
          idf/test/fuzz/run_fuzz.sh build-fuzz 60 | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-findings
          path: |
            build-fuzz/crashes/
            build-fuzz/logs/

  # Issue #231: clang-tidy on gw_core and the host tests, with the checks of idf/.clang-tidy (the
  # static analyzer of clang, bugprone and the warnings of clang). The configuration of the host
  # build with clang gives compile_commands.json; the job does not build. Each result is an error
  # (WarningsAsErrors), and a NOLINT without its check and a reason also stops the job.
  clang-tidy:
    name: clang-tidy on gw_core and the host tests (issue #231)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install clang 18 and clang-tidy 18
        timeout-minutes: 45   # apt_install.sh: 2 mirrors, 20 min at most each
        run: |
          sudo idf/tools/ci/apt_install.sh clang-18 clang-tidy-18
      - name: Each NOLINT names its check and gives a reason
        run: |
          if grep -rnE 'NOLINT' --include='*.[ch]' idf/components/gw_core idf/test/host |
             grep -vE 'NOLINT(NEXTLINE|BEGIN)?\([A-Za-z0-9.,*-]+\): [^ ]|NOLINTEND\('; then
            echo "::error::a NOLINT without its check and a reason (issue #231)"
            exit 1
          fi
      - name: Run clang-tidy
        run: |
          cmake -S idf/test/host -B build-tidy -DCMAKE_C_COMPILER=clang-18 -DGW_RULE_CHECKS=OFF \
                -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          run-clang-tidy-18 -clang-tidy-binary clang-tidy-18 -p build-tidy -j"$(nproc)" -quiet \
                            'idf/components/gw_core/(src|port)/|idf/test/host/'

  firmware:
    name: ESP32-S3 firmware build (QA-2)
    runs-on: ubuntu-24.04
    container:
      image: espressif/idf:v6.1@sha256:f81b6e077e6af93c312181cd7d4e7936cfbafc5c7f77cbacba8fdd34994f218a
    defaults:
      run:
        shell: bash
    env:
      IDF_CCACHE_ENABLE: 1
      CCACHE_DIR: /tmp/ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 400M
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0   # FW-4: the version carries the git hash
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/ccache
          key: ccache-firmware-f81b6e07-${{ github.sha }}
          restore-keys: ccache-firmware-f81b6e07-
      - name: Build (0 warnings required)
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          . "$IDF_PATH/export.sh"
          ccache -z
          cd idf
          idf.py set-target esp32s3 build 2>&1 | tee build.log
          if grep -E "warning:" build.log; then
            echo "::error::the firmware build produced warnings"
            exit 1
          fi
          idf.py size | tee size.txt
          ccache -s
      # issue #227: the largest frames and the deepest own call path of the tasks rs485_bus and
      # sparkplug, from the -fstack-usage and -fcallgraph-info=su data of the build
      - name: Stack report of the own code
        run: |
          cd idf
          python3 tools/stack_report.py build > stack.txt
          cat stack.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: firmware-esp32s3
          path: |
            idf/build/*.bin
            idf/build/bootloader/bootloader.bin
            idf/build/partition_table/partition-table.bin
            idf/build/flash_args
            idf/size.txt
            idf/stack.txt

  # Issue #230: the GCC static analyzer (-fanalyzer) on the own components (gw_* and main). The
  # host tests compile only gw_core; this job also examines the IDF adapters (gw_web, gw_fw,
  # gw_storage, gw_edge, gw_net, gw_bus, main, ...). -D GW_ANALYZER=ON (cmake/gw_warnings.cmake)
  # adds -fanalyzer only to the own components, in the separate build directory build-analyzer:
  # the release build of the job firmware does not change. ESP-IDF and the managed components
  # compile without the analyzer, from ccache. With -Werror, a result of the analyzer stops the
  # build. docs/reference/compiler-warnings-and-stack.md
  analyzer:
    name: GCC static analyzer of the own components (issue #230)
    runs-on: ubuntu-24.04
    container:
      image: espressif/idf:v6.1@sha256:f81b6e077e6af93c312181cd7d4e7936cfbafc5c7f77cbacba8fdd34994f218a
    defaults:
      run:
        shell: bash
    env:
      IDF_CCACHE_ENABLE: 1
      CCACHE_DIR: /tmp/ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 400M
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/ccache
          key: ccache-analyzer-f81b6e07-${{ github.sha }}
          restore-keys: ccache-analyzer-f81b6e07-
      - name: Build with -fanalyzer (0 results required)
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          . "$IDF_PATH/export.sh"
          ccache -z
          cd idf
          rc=0
          idf.py -B build-analyzer -D GW_ANALYZER=ON set-target esp32s3 build 2>&1 | tee analyzer.log || rc=$?
          ccache -s
          # the results in the own code, without the colour codes of -fdiagnostics-color=always
          sed 's/\x1b\[[0-9;]*[mK]//g' analyzer.log > analyzer-plain.log
          if grep -E "/idf/(components/gw_[a-z0-9_]+|main)/.*\[-W(error=)?analyzer-" analyzer-plain.log; then
            echo "::error::the GCC static analyzer found a result in the own code"
            exit 1
          fi
          if grep -E "warning:" analyzer-plain.log; then
            echo "::error::the analyzer build produced warnings"
            exit 1
          fi
          exit "$rc"

  # Issue #121: the E2E in parallel jobs, for the default variant, for the octal PSRAM one
  # (#85: the configuration, the Sparkplug engine and its payload buffer, mbedTLS and the store &
  # forward ring in PSRAM; the harness writes otadata into the image first, for the QEMU
  # defect of issue #239) and for the secure one (#261). The default and PSRAM variants are the
  # configuration of the board. The secure variant is the PSRAM build with sdkconfig.qemu-secure
  # (NVS encryption, signed OTA images: only in the QEMU build, #133), and it runs only the
  # scenarios of these two functions. e2e-plan reads the groups from idf/tools/e2e/scenarios.py
  # (CI_GROUPS: together one full run, each scenario in one group, as test_harness.py checks).
  # e2e-build builds the QEMU images once per variant (run_e2e.sh with E2E_STAGE; the secure
  # variant also builds the board build of the PSRAM variant, the firmware before the OTA update
  # of its group nvs-ota). Each e2e job runs one group of one variant on those images, without a
  # build (E2E_PREBUILT). e2e-summary puts one line per group into the job summary and fails
  # unless the groups of each variant passed and ran one full run.
  e2e-plan:
    name: E2E groups (issue #121)
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.plan.outputs.build }}
      run: ${{ steps.plan.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: plan
        run: python3 idf/tools/e2e/scenarios.py matrix | tee -a "$GITHUB_OUTPUT"

  e2e-build:
    name: QEMU images for the E2E (${{ matrix.variant }})
    needs: e2e-plan
    runs-on: ubuntu-24.04
    container:
      image: espressif/idf:v6.1@sha256:f81b6e077e6af93c312181cd7d4e7936cfbafc5c7f77cbacba8fdd34994f218a
    defaults:
      run:
        shell: bash
    strategy:
      matrix: ${{ fromJSON(needs.e2e-plan.outputs.build) }}
    env:
      IDF_CCACHE_ENABLE: 1
      CCACHE_DIR: /tmp/ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 600M
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0   # FW-4: the version carries the git hash
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/ccache
          key: ccache-e2e-${{ matrix.variant }}-f81b6e07-${{ github.sha }}
          restore-keys: ccache-e2e-${{ matrix.variant }}-f81b6e07-
      - name: Build the QEMU images
        env:
          E2E_PSRAM: ${{ matrix.psram }}
          E2E_SECURE: ${{ matrix.secure }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          . "$IDF_PATH/export.sh"
          ccache -z
          E2E_STAGE=/tmp/e2e-images E2E_WORKDIR=/tmp/e2e-build idf/tools/e2e/run_e2e.sh
          ccache -s
          tar -C /tmp/e2e-images -czf /tmp/e2e-images.tgz .
      # the secure variant: the throwaway signing key of this run's QEMU image goes with it (kept
      # for one day), and the board build that its group nvs-ota starts on (board/)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-images-${{ matrix.variant }}
          path: /tmp/e2e-images.tgz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  e2e:
    name: QEMU end to end, ${{ matrix.variant }}, ${{ matrix.group }} (QA-3)
    needs: [e2e-plan, e2e-build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    container:
      # Issue #253: the E2E image (idf/tools/e2e/Dockerfile, e2e-image.yml): the IDF image above plus
      # mosquitto, libslirp0, QEMU and the venv of the harness, so the job installs nothing
      image: ghcr.io/tmijail/gw-e2e@sha256:a0411aa163a8a34a68748421204022d06ba39fa3639262d703c70ed0f95500b8
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.e2e-plan.outputs.run) }}
    env:
      VARIANT: ${{ matrix.variant }}
      GROUP: ${{ matrix.group }}
      ONLY: ${{ matrix.only }}
      E2E_PSRAM: ${{ matrix.psram }}
      E2E_SECURE: ${{ matrix.secure }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: e2e-images-${{ matrix.variant }}
          path: /tmp/e2e-dl
      - name: Run the group's scenarios on the prebuilt images
        run: |
          . "$IDF_PATH/export.sh"
          export PATH="$PATH:/usr/sbin"
          mkdir -p /tmp/e2e-images
          for t in /tmp/e2e-dl/*.tgz; do tar -C /tmp/e2e-images -xzf "$t"; done
          E2E_PREBUILT=/tmp/e2e-images E2E_WORKDIR=/tmp/e2e-work \
              idf/tools/e2e/run_e2e.sh --only "$ONLY" --no-skip
      - name: Summary line
        if: always()
        run: |
          python3 idf/tools/e2e/scenarios.py line --header "$VARIANT" "$GROUP" /tmp/e2e-work \
              | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: e2e-${{ matrix.variant }}-${{ matrix.group }}
          path: |
            /tmp/e2e-work/*.log
            /tmp/e2e-work/*.qemu
            /tmp/e2e-work/results.json
            /tmp/e2e-work/coredump-info.txt
            /tmp/e2e-work/qemu-exits.txt
            /tmp/e2e-work/fault-*.txt
            /tmp/e2e-work/qemu/*/core-bt.txt
            /tmp/e2e-work/payloads/
      # only what e2e-summary reads
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: e2e-result-${{ matrix.variant }}-${{ matrix.group }}
          path: |
            /tmp/e2e-work/results.json
            /tmp/e2e-work/qemu-exits.txt

  e2e-summary:
    name: E2E summary of the groups (issue #121)
    needs: [e2e-plan, e2e]
    if: always() && needs.e2e-plan.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true   # a missing group is reported below
        with:
          pattern: e2e-result-*
          path: /tmp/e2e-results
      - name: One line per group; each variant's groups passed and ran one full run
        run: |
          rc=0
          python3 idf/tools/e2e/scenarios.py summary /tmp/e2e-results > /tmp/summary.md || rc=$?
          cat /tmp/summary.md | tee -a "$GITHUB_STEP_SUMMARY"
          exit "$rc"

  # Issue #104 (item 3): the OTA scenarios on a build with comprehensive heap poisoning
  # (sdkconfig.qemu-poison): freed memory is overwritten, so a use after free such as the one of
  # issue #98 changes what the firmware reports and the check fails. Only --only ota: with
  # poisoning and no PSRAM the #80 memory margins are not met (docs/reference/e2e-harness.md#heap-poisoning).
  e2e-poison:
    name: QEMU OTA scenarios with heap poisoning, ${{ matrix.variant }} (issue #104)
    runs-on: ubuntu-24.04
    # FW-1 in the PSRAM variant (the board's configuration): its checks save the configuration,
    # and without PSRAM the poisoning leaves too little internal RAM for the validation of a save
    # (503; heap poisoning in docs/reference/e2e-harness.md). ota-park and ota-trial save no
    # configuration and run fast without PSRAM. ota-wiring runs without poisoning in the e2e jobs.
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: psram
            psram: "1"
            only: ota-fw1
          - variant: default
            psram: "0"
            only: ota-park,ota-trial
    permissions:
      contents: read
      packages: read
    container:
      # Issue #253: the E2E image (idf/tools/e2e/Dockerfile, e2e-image.yml): the IDF image above plus
      # mosquitto, libslirp0, QEMU and the venv of the harness, so the job installs nothing
      image: ghcr.io/tmijail/gw-e2e@sha256:a0411aa163a8a34a68748421204022d06ba39fa3639262d703c70ed0f95500b8
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    env:
      IDF_CCACHE_ENABLE: 1
      CCACHE_DIR: /tmp/ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 400M
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
