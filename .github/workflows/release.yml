# Issue #279: the release of the firmware. A tag v0.<minor>.<patch> makes a GitHub pre-release
# with the images of the build for the board, manifest.json and SHA256SUMS. See
# docs/how-to/make-a-release.md and docs/reference/release-manifest.md.
#
# The job build makes the build for the board with -D GW_RELEASE=ON: the version is GW_VERSION
# of idf/CMakeLists.txt, without the git hash, and the configuration refuses a work tree with a
# change. idf/tools/release/make_manifest.py refuses a tag that is not v<GW_VERSION> and a build
# that is not the build for the board (a QEMU build, an option that burns an eFuse). Then it
# writes the part files, manifest.json and SHA256SUMS. The job publish makes the pre-release.
#
# A manual run (workflow_dispatch) is a dry run. It makes the build and the manifest, keeps them
# as the artifact firmware-release, and makes no release.
#
# The tag v1.0 is for the commit of the first installed gateway (CLAUDE.md). This workflow does
# not start for it, and make_manifest.py refuses each tag that is not v0.<minor>.<patch>.
#
# The build uses no cache: a release image comes only from the commit of its tag and from the
# ESP-IDF image, pinned by digest as in ci.yml. Only the job publish has the permission
# contents: write, and it runs no code of the repository. Each action is pinned to a full commit
# hash, with its tag in the comment, and actions/checkout does not keep the token (issue #229).
name: Release

on:
  push:
    tags:
      - "v0.[0-9]+.[0-9]+"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build the release images and the manifest
    runs-on: ubuntu-24.04
    container:
      image: espressif/idf:v6.1@sha256:f81b6e077e6af93c312181cd7d4e7936cfbafc5c7f77cbacba8fdd34994f218a
    defaults:
      run:
        shell: bash
    env:
      # the tag of the release; empty in a dry run
      RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_type == 'tag' && github.ref_name || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # before the build, which is long: the tag is v<GW_VERSION>
      - name: The tag agrees with GW_VERSION
        if: env.RELEASE_TAG != ''
        run: python3 idf/tools/release/make_manifest.py --tag "$RELEASE_TAG" --tag-only
      # The log goes to /tmp: with GW_RELEASE=ON, a file in idf/ that is not in a commit stops
      # the configuration.
      - name: Build for the board with GW_RELEASE=ON (0 warnings required)
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          . "$IDF_PATH/export.sh"
          cd idf
          idf.py -D GW_RELEASE=ON set-target esp32s3 build 2>&1 | tee /tmp/build.log
          if grep -E "warning:" /tmp/build.log; then
            echo "::error::the firmware build produced warnings"
            exit 1
          fi
      # --tag and --release: the version of the build is GW_VERSION, without the git hash
      - name: Make the release files and examine the build
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            mode=(--tag "$RELEASE_TAG")
          else
            mode=(--release)
          fi
          python3 idf/tools/release/make_manifest.py --build-dir idf/build \
              --out idf/build/release "${mode[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
          (cd idf/build/release && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: firmware-release
          path: idf/build/release/
          if-no-files-found: error

  publish:
    name: Publish the pre-release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # gh release create: the release and its files
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: firmware-release
          path: release
      - name: Examine the files with SHA256SUMS
        run: cd release && sha256sum -c SHA256SUMS
      # gh release create stops when the tag has a release already: a release is never replaced.
      - name: Make the pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          notes="Firmware images of the build for the Waveshare ESP32-S3-POE-ETH-8DI-8DO board.
          \`manifest.json\` gives the offset, the size and the SHA-256 of each file:
          https://mijail.ar/mqtt-rs485-gateway/reference/release-manifest/

          **Warning: The firmware has never run on the board (#1, #18).** It has only run in
          host tests and in QEMU."
          gh release create "$TAG" --repo "$REPO" --verify-tag --prerelease --title "$TAG" \
              --notes "$notes" --generate-notes release/*
