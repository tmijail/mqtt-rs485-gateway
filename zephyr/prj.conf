# Common configuration of the gateway firmware.
# Board specific parts live in boards/<board>.conf.

# --- System ---------------------------------------------------------------
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=8192
CONFIG_REBOOT=y
CONFIG_HWINFO=y
CONFIG_ENTROPY_GENERATOR=y
CONFIG_TASK_WDT=y
CONFIG_WATCHDOG=y

# --- Logging and shell (REL-3) ---------------------------------------------
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_GW_LOG_LEVEL_INF=y
CONFIG_SHELL=y
CONFIG_SHELL_STACK_SIZE=3072

# --- Persistent storage ---------------------------------------------------
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_ZMS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_ZMS=y
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y

# --- RS485 / Modbus RTU master --------------------------------------------
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_MODBUS=y
CONFIG_MODBUS_ROLE_CLIENT=y
CONFIG_MODBUS_SERIAL=y
# Honour the configured stop bits instead of the parity-derived default.
CONFIG_MODBUS_NONCOMPLIANT_SERIAL_MODE=y

# --- Networking and MQTT --------------------------------------------------
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_CONNECTION_MANAGER=y
CONFIG_DNS_RESOLVER=y
CONFIG_SNTP=y
CONFIG_MQTT_LIB=y
CONFIG_ZVFS_EVENTFD=y

# --- Sparkplug B payloads -------------------------------------------------
CONFIG_NANOPB=y

# --- Local I/O ------------------------------------------------------------
CONFIG_GPIO=y
