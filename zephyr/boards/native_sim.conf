# Host simulation: offloaded (host) sockets instead of the W5500.
CONFIG_ETH_NATIVE_TAP=n
CONFIG_NET_DRIVERS=y
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_NET_NATIVE_OFFLOADED_SOCKETS=y

# 1 kHz DI sampling needs a 1 ms tick (the native_sim default is 10 ms).
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000

# Shell and logs on stdin/stdout so a test harness can drive "gw di".
CONFIG_UART_NATIVE_PTY_0_ON_STDINOUT=y
CONFIG_SHELL_PROMPT_UART=""
CONFIG_SHELL_VT100_COLORS=n
CONFIG_SHELL_ECHO_STATUS=n
CONFIG_LOG_BACKEND_NATIVE_POSIX=n
