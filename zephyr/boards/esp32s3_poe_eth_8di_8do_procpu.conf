# Waveshare ESP32-S3-POE-ETH-8DI-8DO: W5500 Ethernet with the native IP stack.

CONFIG_SPI=y
CONFIG_NET_DRIVERS=y
CONFIG_ETH_DRIVER=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_L2_ETHERNET_MGMT=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_CONTEXT_SNDTIMEO=y
CONFIG_NET_MAX_CONTEXTS=8

# TCA9554 output expander and the RGB status LED (RMT).
CONFIG_I2C=y
CONFIG_LED_STRIP=y
